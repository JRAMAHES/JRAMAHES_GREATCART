{% extends "base.html" %}

{% block content %}
    <!-- ========================= SECTION CONTENT ========================= -->
    <section class="section-conten padding-y" style="min-height:84vh">

        <!-- ============================ COMPONENT LOGIN   ================================= -->
        <div class="card mx-auto" style="max-width: 560px; margin-top:30px;">
        <div class="card-body">
        <h4 class="card-title mb-4">Reset Password</h4>
        {% include 'includes/alert.html' %}
        <form action="{% url 'resetPassword' %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input type="password" class="form-control" placeholder="create password" name="password">
            </div>

            <!-- form-group// -->
            <div class="form-group">
                <input type="password" class="form-control" placeholder="Confirm Password" name="confirm_password" >
            </div> 

            <!-- form-group// -->
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">Reset Password!</button>
            </div> <!-- form-group// -->    
        </form>
        </div> <!-- card-body.// -->
        </div> <!-- card .// -->

        <p class="text-center mt-4">Don't have account? <a href="{% url 'register' %}">Sign up</a></p>
        <br>
        <!-- ============================ COMPONENT LOGIN  END.// ================================= -->
    </section>
    <!-- ========================= SECTION CONTENT END// ========================= -->

{% endblock content %}

<script>
  setTimeout(() => {
    document.querySelectorAll('.message-box').forEach(msg => {
      msg.style.display = 'none';
    });
  }, 6000); // auto-dismiss after 6 seconds
</script>
