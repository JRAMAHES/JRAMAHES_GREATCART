{% extends 'base.html' %}
{% load static %}

{% block content %}

	<div class="container">
        <!-- ================= COMPONENT 1 ===================== -->
        <div class="row mb-5">
            <aside class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Billing Address</h5>
                        <form action="{% url 'checkout' %}" method="POST">
                            {% csrf_token %}
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">First Name</label>
                                    <input type="text" name="first_name" class="form-control" placeholder="Enter your first name" required>
                                </div>
                                
                                <div class="form-group">
                                    <label>Last Name</label>
                                    <input placeholder="Enter your last name" type="text" name="last_name" class="form-control" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">Email: </label>
                                    <input type="email" name="email" class="form-control" required placeholder="Enter your email address" title="Please enter your email address">
                                </div>
                                
                                <div class="col form-group">
                                    <label for="phone">Phone Number:</label>
                                    <input type="tel" id="phone" class="form-control" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">Address Line 1: </label>
                                    <input type="text" name="address_line_1" class="form-control" required placeholder="1234 Main Street">   
                                </div>
                                
                                <div class="col form-group">
                                    <label for="phone">Address Line 2:</label>
                                    <input type="text" class="form-control" name="address_line_2" placeholder="1234 Main Street">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">City: </label>
                                    <input type="text" name="city" class="form-control" required placeholder="1234 Main Street" required>   
                                </div>
                                
                                <div class="col form-group">
                                    <label for="phone">State:</label>
                                    <input type="text" class="form-control" name="state" placeholder="1234 Main Street" required>
                                </div>

                                <div class="col form-group">
                                    <label for="phone">Country:</label>
                                    <input type="text" class="form-control" name="country" placeholder="country" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <label for="">Order Notes &nbsp; &RightArrowBar;</label>
                                <textarea class="form-control" name="order_notes" rows="2" placeholder="Any special instructions or notes for your order">

                                </textarea>
                            </div>

                         
                    </div>
                </div> <!-- card.// -->
                
            </aside> <!-- col.// -->

            <aside class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-borderless table-shopping-cart">
                            <thead class="text-muted">
                                <tr class="small text-uppercase">
                                    <th scope="col">Product</th>
                                    <th scope="col" width="120">Quantity</th>
                                    <th scope="col" width="120">Price</th>
                                    <th scope="col" class="text-right" width="200"> </th>
                                </tr>
                            </thead>
                            <tbody>
                                
                                <!-- looping product -->
                                {% for cart_item in cart_items %}
                                <tr>
                                    <td>
                                        <figure class="itemside align-items-center" style="width: 130% !important;">
                                            <div class="aside"><img src="{{ cart_item.product.image.url }}" alt="product" class="img-sm"></div>
                                            <figcaption class="info">
                                                <a href="{{ cart_item.product.get_url }}" class="title text-dark">{{ cart_item.product.product_name }}</a>
                                                <p class="text-muted small color-size">
                                                    {% if cart_item.variation.all %}
                                                        {% for item in cart_item.variation.all %}
                                                            {{ item.variation_category | capfirst }} :&rightarrowtail; {{ item.variation_value | capfirst }} <br>
                                                        {% endfor %}
                                                    {% endif %}
                                                </p>
                                            </figcaption>
                                        </figure>
                                    </td>
                                    <td align="center">
                                        <label for="">{{ cart_item.quantity }}</label>
                                    </td>
                                    <td> 
                                        <div class="price-wrap"> 
                                            <var class="price">${{ cart_item.sub_total }}</var> 
                                            <small class="text-muted"> $ {{ cart_item.product.price }} each </small> 
                                        </div> <!-- price-wrap .// -->
                                    </td>
                                    <!-- Message alerts are handled at the bottom of the template -->
                                </tr>
                                {% endfor %}
                                
                            </tbody>
                        </table>
                        <button type="submit"  name="submit" class="btn btn-primary btn-block">Place Order  &RightArrowBar;</button>
                        <a href="{% url 'store' %}" class="btn btn-light btn-block">Continue Shopping</a>
                        </form>
                    </div> <!-- card-body.// -->
                </div> <!-- card.// -->
            </aside> <!-- col.// -->
            
        </div> <!-- row.// -->
        <!-- ============================ COMPONENT 1 END .// ================================= -->

	</div> <!-- container .//  -->
	<!-- ========================= SECTION CONTENT END// ========================= -->
	 
	<!-- CDN for SweetAlert2 -->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


{% endblock %}
